<html lang="en">
<head>

<body>

        <div>

        <div>

        <button type="submit" id="but1">click</button>
        </form>

        </form>
    </div>
    
    <script>
        const form1=document.getElementById("loginform1")
        const form2=document.getElementById("loginform2")
        
        const email=document.getElementById("email")
        const pass=document.getElementById("pass")

        const emailEr=document.getElementById("emailEr")
        const passEr=document.getElementById("passEr")
        
        let temp1=""
        let temp2=""

        emailEr.textContent=""
        passEr.textContent=""

        form1.addEventListener("submit",function(e){
            e.preventDefault();

            let emaill=email.value;
            let passs= pass.value;

            if(emaill===""){
                emailEr.textContent="vui long nhap email"
            }
            if(passs===""){
                passEr.textContent="vui long nhap pass"
            }
            if(emaill !== "" && passs !== ""){
                temp1=email.value;
                temp2=pass.value;
                // form1.   submit();
            }
        })
        form2.addEventListener("submit",function(e){
            e.preventDefault();
            alert(temp1);
            alert(temp2);
        })
    </script>
